<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>J-BOT Spectate • Process Manager</title>

    <link rel="stylesheet"
          href="process.css?v=5">

</head>

<body>

<div class="background-glow"></div>

<div class="container">

    <!-- ========================================================= -->
    <!-- HERO -->
    <!-- ========================================================= -->

    <header class="hero">

        <div class="hero-left">

            <div class="hero-title-row">

                <h1>J-BOT</h1>

                <span class="hero-badge">
                    PROCESS
                </span>

            </div>

            <p class="subtitle">
                ROS2 Runtime Process Manager
            </p>

        </div>

        <div class="hero-right">

        <button
            id="disconnect-all"
            class="disconnect-button">

            Disconnect

        </button>

        <button
            id="stop-all"
            class="stop-all-button">

            Emergency Stop

        </button>

        <a
            href="index.html"
            class="back-button">

            ← Dashboard

        </a>

        </div>

    </header>

    <!-- ========================================================= -->
    <!-- WORKSPACE -->
    <!-- ========================================================= -->

    <section class="workspace">

        <div class="workspace-header">

            <div>

                <div class="title">
                    Active Workspace
                </div>

                <code>
                    /home/atitya/Documents/J-Bot/ros_ws
                </code>

            </div>

            <div class="workspace-status">

                <span class="live-dot"></span>

                READY

            </div>

        </div>

    </section>

    <!-- ========================================================= -->
    <!-- PROCESS GRID -->
    <!-- ========================================================= -->

    <main id="process-container"></main>

</div>

<footer>

    J-BOT • Spectate Runtime

</footer>

<script src="process.js?v=5"></script>

</body>

</html>
